services:
  app:
    build: .
    restart: unless-stopped
    # Only reachable from the VPS itself — nginx is what the internet talks
    # to, and it proxies here. Nothing binds this port on the public interface.
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: "file:/data/mehfuz.db"
      UPLOAD_DIR: "/data/uploads"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    volumes:
      # Named volume, not a bind mount, so a container rebuild (new image)
      # never touches the database file or uploaded photos underneath it.
      - mehfuz-data:/data

volumes:
  mehfuz-data:
