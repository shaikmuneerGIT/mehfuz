# Reverse proxy: the internet talks to nginx on port 80, nginx forwards to
# the app container on 127.0.0.1:4000 (see docker-compose.yml).
#
# Install to /etc/nginx/sites-available/mehfuz, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. Full steps in README.md.
#
# server_name starts as "_" (matches any hostname/IP) so the site works
# immediately. Once your domain's DNS points here, run certbot (see
# README) — it rewrites this file to add the real domain and HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 6M; # a little above the app's own 5MB upload cap

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
